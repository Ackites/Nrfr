name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version Info
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git rev-parse --short HEAD)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "### Build $VERSION" > CHANGELOG.md

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Build Android APK
        shell: bash
        run: |
          BUILD_FILE=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          test -n "$BUILD_FILE" || exit 1
          DIR=$(dirname "$BUILD_FILE")
          cd "$DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Build Wails App
        shell: bash
        run: |
          cd nrfr-client/frontend
          npm install
          cd ..
          wails build

      - name: Copy Android APK
        shell: bash
        run: |
          mkdir -p nrfr-client/build/bin/resources
          APK=$(find . -path "*/build/outputs/apk/*/app-*.apk" | head -n 1)
          test -n "$APK" || exit 1
          cp "$APK" nrfr-client/build/bin/resources/nrfr.apk
          cp "$APK" nrfr-${{ steps.version.outputs.version }}.apk

      - name: Create Release Archive
        shell: bash
        run: |
          cd nrfr-client/build/bin
          7z a ../../nrfr-${{ steps.version.outputs.version }}-release.zip ./*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            nrfr-${{ steps.version.outputs.version }}.apk
            nrfr-client/nrfr-${{ steps.version.outputs.version }}-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
