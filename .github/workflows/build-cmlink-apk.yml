name: Build CMLink Backup Calling APK

on:
  workflow_dispatch:
  push:
    branches:
      - cmlink-backup-calling

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Replace android.jar with AOSP public+hidden API jar
        run: |
          curl -L https://raw.githubusercontent.com/Reginer/aosp-android-jar/refs/heads/main/android-34/android.jar \
            -o "$ANDROID_HOME/platforms/android-34/android.jar"

      - name: Generate Gradle wrapper
        run: gradle wrapper

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nrfr-cmlink-backup-calling-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
